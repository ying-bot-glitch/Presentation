<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Demo Hub</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,700;12..96,800&family=IBM+Plex+Mono:wght@400&family=Noto+Sans+SC:wght@300&display=swap" rel="stylesheet">

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --accent: #bc5a33;
      --ink: #1c1914;
      --paper: #f4f0e8;
      --rule: #c8c2b4;
      --muted: #8c7f6e;
    }

    body {
      background: var(--paper);
      color: var(--ink);
      font-family: 'Noto Sans SC', -apple-system, BlinkMacSystemFont, sans-serif;
      font-weight: 300;
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }

    .container {
      max-width: 1040px;
      margin: 0 auto;
      padding: 0 56px;
    }

    /* ── Header ── */
    header { padding: 44px 0 0; }

    .site-label {
      display: flex;
      align-items: center;
      gap: 10px;
      font-family: 'IBM Plex Mono', monospace;
      font-size: 11.5px;
      letter-spacing: 0.24em;
      text-transform: uppercase;
      color: var(--ink);
      margin-bottom: 36px;
    }

    .site-label::before {
      content: '';
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--accent);
      flex-shrink: 0;
    }

    .hero {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 56px;
      padding-bottom: 52px;
    }

    h1 {
      font-family: 'Bricolage Grotesque', sans-serif;
      font-size: clamp(54px, 10vw, 104px);
      font-weight: 800;
      line-height: 0.92;
      letter-spacing: -0.03em;
      color: var(--ink);
    }

    .hero-desc {
      flex-shrink: 0;
      max-width: 300px;
      font-family: 'Noto Sans SC', sans-serif;
      font-weight: 300;
      font-size: clamp(15px, 1.6vw, 17px);
      line-height: 1.7;
      color: var(--accent);
      padding-bottom: 6px;
    }

    hr {
      border: none;
      border-top: 1px solid var(--rule);
    }

    /* ── Projects ── */
    main { padding: 0 0 96px; }

    .project {
      display: grid;
      grid-template-columns: 88px 1fr auto;
      align-items: start;
      gap: 0 40px;
      padding: 44px 0;
      border-bottom: 1px solid var(--rule);
    }

    .project-num {
      font-family: 'Bricolage Grotesque', sans-serif;
      font-size: clamp(40px, 5vw, 64px);
      font-weight: 700;
      color: var(--accent);
      line-height: 1;
      padding-top: 2px;
    }

    .project-body { min-width: 0; }

    .project-tag {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 12px;
      letter-spacing: 0.08em;
      color: var(--muted);
      margin-bottom: 8px;
    }

    .project-name {
      font-family: 'Bricolage Grotesque', 'Noto Sans SC', sans-serif;
      font-size: clamp(26px, 3.2vw, 38px);
      font-weight: 700;
      letter-spacing: -0.02em;
      line-height: 1.1;
      color: var(--ink);
      margin-bottom: 4px;
    }

    /* ── Buttons ── */
    .project-links {
      display: flex;
      flex-direction: column;
      gap: 8px;
      flex-shrink: 0;
      padding-top: 6px;
    }

    .btn {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 28px;
      padding: 11px 18px;
      border: 1px solid var(--rule);
      background: transparent;
      text-decoration: none;
      color: var(--ink);
      font-family: 'IBM Plex Mono', monospace;
      font-size: 13.5px;
      min-width: 152px;
      transition: background 0.15s, border-color 0.15s, color 0.15s;
    }

    .btn:hover {
      background: var(--ink);
      border-color: var(--ink);
      color: var(--paper);
    }

    .btn-arrow {
      color: var(--accent);
      font-size: 15px;
      line-height: 1;
      transition: color 0.15s;
      flex-shrink: 0;
    }

    .btn:hover .btn-arrow { color: var(--paper); }

    /* ── Loading / Error states ── */
    .state-row {
      padding: 44px 0;
      font-family: 'IBM Plex Mono', monospace;
      font-size: 13px;
      color: var(--muted);
      letter-spacing: 0.06em;
      border-bottom: 1px solid var(--rule);
    }

    /* ── Footer ── */
    footer {
      border-top: 1px solid var(--rule);
      padding: 20px 0 32px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .footer-text {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 11.5px;
      letter-spacing: 0.1em;
      color: var(--muted);
      text-transform: uppercase;
    }

    /* ── Responsive ── */
    @media (max-width: 680px) {
      .container { padding: 0 24px; }
      .hero { flex-direction: column; align-items: flex-start; gap: 20px; }
      .hero-desc { max-width: 100%; }
      .project { grid-template-columns: 60px 1fr; gap: 0 24px; }
      .project-links {
        grid-column: 2;
        flex-direction: row;
        flex-wrap: wrap;
        margin-top: 20px;
      }
      .btn { min-width: 130px; }
    }
  </style>
</head>
<body>
  <div class="container">

    <header>
      <div class="site-label">Personal Demo Collection</div>
      <div class="hero">
        <h1>Demo<br>Hub</h1>
        <p class="hero-desc">汇总不同主题的交互演示与培训材料。</p>
      </div>
    </header>

    <hr>

    <main id="main">
      <div class="state-row" id="status">正在加载…</div>
    </main>

    <footer>
      <span class="footer-text" id="footer-count">— Projects</span>
      <span class="footer-text">Demo Hub</span>
    </footer>

  </div>

  <script>
    // ── Config ──────────────────────────────────────────────────────────────
    // Derived from the GitHub Pages URL: ying-bot-glitch.github.io/follow-builders
    const OWNER = 'ying-bot-glitch';
    const REPO  = 'follow-builders';
    const BRANCH = 'main';

    // Files / folders at root level to ignore entirely
    const ROOT_IGNORE = new Set(['index.html', '.nojekyll', 'README.md', 'README', 'LICENSE', '.gitignore']);

    // ── Helpers ─────────────────────────────────────────────────────────────
    const api = path =>
      fetch(`https://api.github.com/repos/${OWNER}/${REPO}/contents/${path}?ref=${BRANCH}`)
        .then(r => { if (!r.ok) throw new Error(r.status); return r.json(); });

    // Strip .html extension for button label, title-case the slug
    const labelFromFilename = name => {
      const base = name.replace(/\.html$/i, '');
      return base.replace(/[-_]/g, ' ').replace(/\b\w/g, c => c.toUpperCase());
    };

    // Folder slug → display title (capitalise each word, replace hyphens/underscores)
    const titleFromSlug = slug =>
      slug.replace(/[-_]/g, ' ').replace(/\b\w/g, c => c.toUpperCase());

    // ── Render ───────────────────────────────────────────────────────────────
    async function load() {
      const main   = document.getElementById('main');
      const status = document.getElementById('status');

      let rootItems;
      try {
        rootItems = await api('');
      } catch (e) {
        status.textContent = '无法连接 GitHub API，请稍后刷新重试。';
        return;
      }

      // Separate root-level HTML files and folders (skip ignored names)
      const rootHtmlFiles = rootItems.filter(
        i => i.type === 'file' && i.name.endsWith('.html') && !ROOT_IGNORE.has(i.name)
      );
      const folders = rootItems.filter(
        i => i.type === 'dir' && !i.name.startsWith('.') && !ROOT_IGNORE.has(i.name)
      );

      // Build entries: each folder becomes one project; root HTML files also become entries
      // Fetch folder contents in parallel
      const folderEntries = await Promise.all(
        folders.map(async folder => {
          try {
            const files = await api(folder.path);
            const htmlFiles = files.filter(f => f.type === 'file' && f.name.endsWith('.html'));
            return { type: 'folder', slug: folder.name, files: htmlFiles };
          } catch {
            return { type: 'folder', slug: folder.name, files: [] };
          }
        })
      );

      // Root-level HTML files become standalone entries
      const rootEntries = rootHtmlFiles.map(f => ({
        type: 'file',
        slug: f.name,
        files: [f],
      }));

      // Merge: folders first, then loose root files
      const entries = [...folderEntries, ...rootEntries].filter(
        e => e.files.length > 0
      );

      // Clear loading state
      main.innerHTML = '';

      if (entries.length === 0) {
        main.innerHTML = '<div class="state-row">仓库中暂无 HTML 文件。</div>';
        return;
      }

      entries.forEach((entry, idx) => {
        const num = String(idx + 1).padStart(2, '0');
        const title = entry.type === 'folder'
          ? titleFromSlug(entry.slug)
          : labelFromFilename(entry.slug);

        const buttonsHtml = entry.files.map(f => {
          const label = labelFromFilename(f.name);
          // Build the GitHub Pages URL for this file
          const href = entry.type === 'folder'
            ? `${entry.slug}/${f.name}`
            : f.name;
          return `<a class="btn" href="${href}">${label} <span class="btn-arrow">↗</span></a>`;
        }).join('\n          ');

        const tag = entry.type === 'folder'
          ? `<span class="project-tag">${entry.slug}</span>`
          : `<span class="project-tag">root</span>`;

        const div = document.createElement('div');
        div.className = 'project';
        div.innerHTML = `
          <div class="project-num">${num}</div>
          <div class="project-body">
            ${tag}
            <div class="project-name">${title}</div>
          </div>
          <div class="project-links">
            ${buttonsHtml}
          </div>`;
        main.appendChild(div);
      });

      document.getElementById('footer-count').textContent =
        `${String(entries.length).padStart(2, '0')} Projects`;
    }

    load();
  </script>
</body>
</html>
